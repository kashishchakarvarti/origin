services:
  postgres:
    image: postgres:16-alpine
    container_name: crest-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: crest
      POSTGRES_PASSWORD: crest
      POSTGRES_DB: crest
    volumes:
      - crest_pg_data:/var/lib/postgresql/data

volumes:
  crest_pg_data:
